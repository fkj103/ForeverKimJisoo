                <div 
                  className="relative rounded-xl overflow-hidden bg-[#f3eff1] mb-2 cursor-zoom-in group shadow-inner border border-[#513D49]/10"
                  onClick={() => setLightboxImage(getLh3Url(currentGoalsSlide.imageId))}
                >
                  <img
                    src={getLh3Url(currentGoalsSlide.imageId)}
                    onError={(e) => {
                      e.currentTarget.src = getDriveThumb(currentGoalsSlide.imageId, 1200);
                    }}
                    alt={currentGoalsSlide.shortName}
                    className="w-full max-h-[550px] object-contain mx-auto transition-transform duration-300 group-hover:scale-[1.01] pointer-events-none"
                  />
                </div>

                {/* Segmented Story Progress Bar (Enabled for multi-slide expansion) */}
                {GOALS_SLIDES.length > 1 && (
                  <div className="flex gap-1.5 w-full mb-4">
                    {GOALS_SLIDES.map((slide, idx) => (
                      <button
                        key={slide.id}
                        onClick={() => setGoalsSlideIndex(idx)}
                        title={slide.shortName}
                        className="flex-1 h-1.5 rounded-full overflow-hidden transition-all bg-[#513D49]/20 hover:bg-[#513D49]/40 cursor-pointer"
                      >
                        <div 
                          className={`h-full transition-all duration-300 ${
                            idx === goalsSlideIndex ? 'w-full bg-[#513D49] shadow-sm' : idx < goalsSlideIndex ? 'w-full bg-[#513D49]/80' : 'w-0'
                          }`}
                        />
                      </button>
                    ))}
                  </div>
                )}

                {/* Target Goals Text Data */}
                {currentGoalsSlide.targets && currentGoalsSlide.targets.length > 0 && (
                  <div className="mt-2 pt-3 border-t border-[#513D49]/10 text-left">
                    <p className="text-[11px] font-bold uppercase tracking-wider text-[#513D49] mb-3">
                      TARGETS
                    </p>
                    <div className="flex flex-col gap-2.5">
                      {currentGoalsSlide.targets.map((targetGrp, tIdx) => (
                        <div key={tIdx} className="p-3.5 rounded-xl bg-[#B0989F]/15 border border-[#513D49]/10">
                          <span className="block text-[10px] font-extrabold uppercase tracking-widest text-[#513D49] mb-1.5">
                            {targetGrp.period}
                          </span>
                          <ul className="flex flex-col gap-1">
                            {targetGrp.items.map((item, iIdx) => (
                              <li key={iIdx} className="text-xs sm:text-sm font-semibold text-[#2b1f26] flex items-start gap-2">
                                <span className="text-[#513D49] mt-[2px] opacity-80 text-[10px]"></span>
                                <span className="leading-snug">{item}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </main>
          )}

          {/* VIEW 5: COMEBACK SUPPORT & FAN PROJECTS */}
          {currentView === 'projects' && (
            <main className="w-full bg-white/85 backdrop-blur-xl border border-white/60 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-[#513D49]/20 transition-all duration-300 text-center animate-fade-in">
              <header className="flex items-center justify-between pb-4 mb-4 border-b border-[#513D49]/15">
                <button
                  onClick={() => navigateTo('home')}
                  className="inline-flex items-center gap-1.5 text-xs font-bold text-[#513D49] bg-white/85 hover:bg-[#513D49] hover:text-white border border-[#513D49]/20 px-3.5 py-2 rounded-xl transition-all duration-200 cursor-pointer"
                >
                  ← Back
                </button>
                <span className="font-serif text-lg tracking-wider text-[#2b1f26]">FAN PROJECTS</span>
              </header>

              <h2 className="font-serif text-2xl text-[#2b1f26] mb-2">Comeback Support & Fan Projects</h2>
              <p className="text-xs sm:text-sm text-[#513D49] mb-6 leading-relaxed max-w-md mx-auto">
                Explore active fanbase initiatives, support digital & physical comeback milestones, and collaborate on special global fan projects!
              </p>

              <div className="flex flex-col gap-4 text-left max-w-lg mx-auto">
                {DATASET.fanProjects.map((proj) => (
                  <div 
                    key={proj.id}
                    className="bg-white/80 border border-[#513D49]/15 rounded-2xl p-4 sm:p-5 shadow-sm hover:shadow-md transition-shadow"
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider bg-[#513D49]/10 text-[#513D49] py-0.5 px-2.5 rounded-lg">
                        {proj.category}
                      </span>
                      <span className="text-xs font-semibold text-[#513D49]">
                        {proj.status}
                      </span>
                    </div>
                    <h3 className="font-serif text-lg text-[#2b1f26] font-semibold mb-1">
                      {proj.title}
                    </h3>
                    <p className="text-xs text-[#513D49] leading-relaxed mb-4">
                      {proj.description}
                    </p>
                    
                    {}
                    {proj.imageId && (
                      <div className="rounded-xl overflow-hidden border border-[#513D49]/10 mt-2 mb-2 shadow-sm">
                        <img 
                          src={getLh3Url(proj.imageId)} 
                          onError={(e) => { e.currentTarget.src = getDriveThumb(proj.imageId, 800); }} 
                          alt={proj.title} 
                          className="w-full h-auto object-contain pointer-events-none" 
                        />
                      </div>
                    )}

                    {proj.id !== 'hashtag-tagging' && (
                      <a
                        href={sanitizeUrl(proj.url)}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center justify-center gap-1.5 py-2 px-4 rounded-xl bg-[#B0989F] hover:bg-[#513D49] text-[#2b1f26] hover:text-white text-xs font-bold transition-all duration-200 shadow-sm"
                      >
                        <span>{proj.actionLabel}</span>
                      </a>
                    )}
                    
                    {/* TEMPORARILY COMMENTED OUT FOR HASHTAG PARTY
                    {proj.id === 'hashtag-tagging' && (
                      <a
                        href={sanitizeUrl(proj.url)}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center justify-center gap-1.5 py-2 px-4 rounded-xl bg-[#B0989F] hover:bg-[#513D49] text-[#2b1f26] hover:text-white text-xs font-bold transition-all duration-200 shadow-sm"
                      >
                        <span>{proj.actionLabel}</span>
                      </a>
                    )}
                    */}
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* VIEW 6: LOCAL & REGIONAL FANBASES DIRECTORY */}
          {currentView === 'fanbases' && (
            <main className="w-full bg-white/85 backdrop-blur-xl border border-white/60 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-[#513D49]/20 transition-all duration-300 animate-fade-in">
              <header className="flex items-center justify-between pb-4 mb-4 border-b border-[#513D49]/15">
                <button
                  onClick={() => navigateTo('home')}
                  className="inline-flex items-center gap-1.5 text-xs font-bold text-[#513D49] bg-white/85 hover:bg-[#513D49] hover:text-white border border-[#513D49]/20 px-3.5 py-2 rounded-xl transition-all duration-200 cursor-pointer"
                >
                  ← Back
                </button>
                <span className="font-serif text-lg tracking-wider text-[#2b1f26]">LOCAL FANBASES</span>
              </header>

              <div className="text-center mb-6">
                <h2 className="font-serif text-2xl text-[#2b1f26] mb-1.5">Global & Regional Fanbases</h2>
                <p className="text-xs sm:text-sm text-[#513D49] max-w-md mx-auto leading-relaxed">
                  Connect with localized fanbase teams around the world for regional group orders, streaming events, and comeback support!
                </p>
              </div>

              {/* Search / Filter Box */}
              <div className="mb-4">
                <input
                  type="text"
                  placeholder="Search by country or handle..."
                  value={fanbaseSearch}
                  onChange={(e) => setFanbaseSearch(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl text-xs sm:text-sm bg-white/90 border border-[#513D49]/20 text-[#2b1f26] placeholder-[#513D49]/60 focus:outline-none focus:ring-2 focus:ring-[#513D49]/30 transition-all"
                />
              </div>

              {/* Styled Table Container */}
              <div className="overflow-hidden rounded-2xl border border-[#513D49]/15 bg-white shadow-sm">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-[#B0989F]/30 border-b border-[#513D49]/15 text-[#513D49]">
                        <th className="py-3 px-4 text-[11px] font-extrabold uppercase tracking-wider w-5/12 sm:w-1/3">
                          Region / Country
                        </th>
                        <th className="py-3 px-4 text-[11px] font-extrabold uppercase tracking-wider w-7/12 sm:w-2/3">
                          Official Accounts
                        </th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#513D49]/10">
                      {filteredFanbases.length > 0 ? (
                        filteredFanbases.map((base) => (
                          <tr 
                            key={base.id} 
                            className="hover:bg-[#B0989F]/10 transition-colors"
                          >
                            <td className="py-3.5 px-4 align-middle">
                              <span className="font-semibold text-xs sm:text-sm text-[#2b1f26]">
                                {base.country}
                              </span>
                            </td>
                            <td className="py-3.5 px-4 align-middle">
                              <div className="flex flex-wrap gap-1.5 sm:gap-2">
                                {base.accounts.map((acc, aIdx) => (
                                  <a
                                    key={aIdx}
                                    href={sanitizeUrl(acc.url)}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#B0989F]/35 hover:bg-[#513D49] text-[#2b1f26] hover:text-white text-xs font-semibold tracking-tight transition-all duration-150 transform hover:-translate-y-0.5 shadow-sm"
                                  >
                                    <svg className="w-3 h-3 fill-current opacity-80" viewBox="0 0 24 24">
                                      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                                    </svg>
                                    <span>{acc.handle}</span>
                                  </a>
                                ))}
                              </div>
                            </td>
                          </tr>
                        ))
                      ) : (
                        <tr>
                          <td colSpan="2" className="py-8 text-center text-xs text-[#513D49]/70 font-medium">
                            No matching fanbases found.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {/* COMMUNITY FOOTER */}
          <footer className="w-full bg-white/85 backdrop-blur-xl border border-white/60 rounded-3xl p-5 text-center shadow-lg shadow-[#513D49]/15">
            <p className="text-[11px] font-bold uppercase tracking-widest text-[#513D49] mb-3 opacity-90">
              Connect With ForeverKimJisoo
            </p>
            <div className="flex items-center justify-center gap-4">
              {DATASET.socials.map((soc) => (
                <a
                  key={soc.name}
                  href={sanitizeUrl(soc.url)}
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label={soc.name}
                  className="w-10 h-10 rounded-full bg-[#B0989F] hover:bg-[#513D49] text-[#513D49] hover:text-white border border-[#513D49]/20 flex items-center justify-center transition-all duration-200 transform hover:-translate-y-1 shadow-sm"
                >
                  {soc.icon}
                </a>
              ))}
            </div>
            <div className="mt-4 pt-3 border-t border-[#513D49]/10 text-[10px] font-bold tracking-widest text-[#513D49]/80 uppercase">
              FOREVERKIMJISOO
            </div>
          </footer>

          {/* LIGHTBOX MODAL */}
          {lightboxImage && (
            <div 
              className="fixed inset-0 z-50 bg-[#140c10]/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer"
              onClick={() => setLightboxImage(null)}
            >
              <button 
                onClick={() => setLightboxImage(null)}
                className="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center text-xl transition-colors cursor-pointer"
                aria-label="Close Lightbox"
              >
                ✕
              </button>
              <img
                src={lightboxImage}
                alt="Full-size guide viewer"
                className="max-w-[95vw] max-h-[90vh] object-contain rounded-xl shadow-2xl pointer-events-none"
                onClick={(e) => e.stopPropagation()}
              />
            </div>
          )}

          {/* SECURITY & STATUS TOAST */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#2b1f26] text-[#f3eff1] border border-white/20 px-4 py-2.5 rounded-xl text-xs font-medium shadow-2xl flex items-center gap-2 animate-fade-in">
              <span className="text-[#B0989F]">🛡️</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // Mount Root React Tree
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
